name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        # GoReleaser publishes linux, darwin, and windows binaries for amd64
        # and arm64; the matrix must exercise the Windows targets too.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: extractions/setup-just@v4
      - name: Install tools
        run: just install-tools
      - name: CI
        run: just ci
