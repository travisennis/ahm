name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.16.0
          # A tag that has a matching docs/releases/<tag>.md file publishes
          # that file as the release body; any other tag falls back to the
          # changelog GoReleaser generates from the commit log.
          args: >-
            release --clean
            ${{ hashFiles(format('docs/releases/{0}.md', github.ref_name)) != '' && format('--release-notes=docs/releases/{0}.md', github.ref_name) || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
